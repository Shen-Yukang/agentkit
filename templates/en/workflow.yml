# generated by agentkit: replaced on upgrade. Put project differences in agentkit.toml.
#
# task: does this change have a task card, has a person confirmed the requirement, was the handoff updated.
# checks: run the checks configured in agentkit.toml for the changed paths; fails if any check fails.
# review: the reviewers listed in review.ci in agentkit.toml each review in a fresh session; the results are merged,
#         finalized, posted as one comment and labeled risk:*; fails if there is a confirmed Important issue.
# Make "agentkit / task", "agentkit / checks" and "agentkit / review" required checks in branch protection.
# Needs: the repository secrets the reviewers use (the default claude-action needs ANTHROPIC_API_KEY and the Claude GitHub App).

name: agentkit

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: agentkit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  task:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Use the gate and config from the base branch
        # A PR cannot change its own gate: the kit script and agentkit.toml always come from the base branch
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "$BASE:.agentkit/agentkit.py" 2>/dev/null; then
            git checkout "$BASE" -- .agentkit agentkit.toml
          else
            echo "::warning::no agentkit on the base branch yet (first install); using the version in this PR"
          fi
      - name: Check the task card
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          BRANCH: ${{ github.head_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if ! python3 .agentkit/agentkit.py task --help >/dev/null 2>&1; then
            echo "::warning::the agentkit on the base branch has no task card check yet (upgrading); skipped this time"
            exit 0
          fi
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          python3 .agentkit/agentkit.py task check --base "$BASE" --committed-only --branch "$BRANCH" --pr-body-file "$RUNNER_TEMP/pr-body.md"

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Use the gate and config from the base branch
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "$BASE:.agentkit/agentkit.py" 2>/dev/null; then
            git checkout "$BASE" -- .agentkit agentkit.toml
          else
            echo "::warning::no agentkit on the base branch yet (first install); using the version in this PR"
          fi
      - name: Run the checks that apply to this change
        run: python3 .agentkit/agentkit.py checks --base "${{ github.event.pull_request.base.sha }}" --committed-only --evidence checks.md
      - name: Keep the evidence for the review job
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentkit-checks
          path: checks.md
          if-no-files-found: ignore

  review:
    needs: checks
    if: always() && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Use the gate and config from the base branch
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "$BASE:.agentkit/agentkit.py" 2>/dev/null; then
            git checkout "$BASE" -- .agentkit agentkit.toml
          else
            echo "::warning::no agentkit on the base branch yet (first install); using the version in this PR"
          fi
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: agentkit-checks
      - name: Decide which reviewers run
        id: plan
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          python3 .agentkit/agentkit.py review --ci --plan | tee -a "$GITHUB_OUTPUT"
          python3 .agentkit/agentkit.py review --ci --print-prompt --base "$BASE" --evidence checks.md \
            --pr-body-file "$RUNNER_TEMP/pr-body.md" --output-file review-action.md > "$RUNNER_TEMP/review-prompt.md"
      - uses: anthropics/claude-code-action@v1
        id: claude
        if: steps.plan.outputs.action == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing this PR and did not write the code. The PR branch is checked out in the current directory.
            The review instructions and all the material are in ${{ runner.temp }}/review-prompt.md: read all of it first, then do exactly what it asks.

            Do not post comments, do not change code, and do not approve or reject the PR; a later step posts the comment.
          claude_args: |
            --max-turns 30 --allowedTools "Read,Grep,Glob,Write,Bash(git diff:*),Bash(git show:*),Bash(git log:*),Bash(python3 .agentkit/agentkit.py validate:*)"
      - name: Explain why the AI review did not run
        if: failure() && steps.claude.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .agentkit/agentkit.py explain-failure --pr "${{ github.event.pull_request.number }}" --file "$RUNNER_TEMP/claude-execution-output.json"
      - name: Run the other reviewers and merge the results
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
          # api reviewers read their keys from these variables (key_env in agentkit.toml); secrets that are not set are empty and do not affect other reviewers
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python3 .agentkit/agentkit.py review --ci --base "$BASE" --evidence checks.md \
            --pr "${{ github.event.pull_request.number }}" --pr-body-file "$RUNNER_TEMP/pr-body.md" \
            --include claude-action=review-action.md --out review.md \
            || echo "::warning::no reviewer produced a valid result; the next step decides"
      - name: Post the review and apply the gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 .agentkit/agentkit.py gate --review review.md
          --pr "${{ github.event.pull_request.number }}"
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
